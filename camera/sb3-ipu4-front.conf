# Surface Book 3 front camera (OV5693 on IPU4P CSI-2 port 2).
# Named to sort after linux-surface-ipu4.conf so these values win over the
# kernel package's older settle quirk (last option for a parameter wins).
#
# Windows receiver delay layout: 0x34<-clk, 0x3c+8i<-data (patch 208).
# Locks every frame; 1000/1100 and 1300/1450 work too.
options intel_ipu4p_isys sb3_front_timing_quirk=0 sb3_front_win_timing=1 sb3_front_clk_ticks=1155 sb3_front_data_ticks=1269
# Continuous MIPI clock (power-on default). 0x2d gates the clock lane between
# lines and the receiver loses sync partway through each frame.
options ov5693 mipi_ctrl00=0
