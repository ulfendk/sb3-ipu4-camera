# Surface Book 3: loading IPU4P early fights the NVIDIA dGPU for CSE/MEI and can
# hang boot. Keep udev from autoloading it; sb3-ipu4-cameras.service loads it
# once the system is up. These modules only exist in linux-surface-ipu4.
blacklist intel_ipu4p
blacklist intel_ipu4p_isys
blacklist intel_ipu4p_psys
blacklist intel_ipu4p_isys_csslib
blacklist intel_ipu4p_psys_csslib

# Front camera (OV5693): Windows receiver delay layout (patch 208). The old
# settle quirk wrote 1392 into the termination registers and never locked.
options intel_ipu4p_isys sb3_front_timing_quirk=0 sb3_front_win_timing=1 sb3_front_clk_ticks=1155 sb3_front_data_ticks=1269
options intel_ipu4p fw_version_check=0
